; Copy this file to thales_paths.ini (same folder) and edit paths on each PC.
; thales_paths.ini is gitignored — do not commit machine-specific paths.
;
; Precedence: environment variables (FDN_THALES_*) override these values.

[Paths]
; Folder that contains MMMReaderHighLevelAPI.dll and dependent DLLs (no trailing slash required)
sdk_bin=C:\Program Files\Thales\Thales Document Reader SDK x64\3.9.2.49\Bin

; Full path to Application.ini (or relative to project root)
application_ini=config\Application.ini

; Optional — default is MMMReaderHighLevelAPI.dll
;dll_name=MMMReaderHighLevelAPI.dll
