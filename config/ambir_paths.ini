; AMBIR DocketPORT scanner configuration
; ─────────────────────────────────────────────────────────────────────────────
; Copy/edit this file on each PC. It is gitignored — do not commit machine paths.
; Environment variables (FDN_AMBIR_*) override these settings.
;
; SETUP STEPS:
;   1. Install the AMBIR DocketPORT USB driver from ambir.com for your model.
;   2. After install, find the DLL. Common locations:
;        C:\Windows\System32\DPORT487.dll      (most common — driver copies here)
;        C:\Windows\SysWOW64\DPORT487.dll      (32-bit driver on 64-bit OS)
;   3. Set dll_path below to the full path of the DLL.
;   4. Set scanner_model to match your hardware.
;
; If dll_path and scanner_model are both left empty (or this file is absent),
; the host will auto-scan C:\Windows\System32 and SysWOW64 for any known DLL.
; ─────────────────────────────────────────────────────────────────────────────

[Paths]

; Full path to the DPORT*.dll installed by the AMBIR USB driver.
; Example:
;   dll_path = C:\Windows\System32\DPORT487.dll
dll_path =

; Model name string — must match exactly (case-sensitive).
; Supported values:
;   DocketPORT467 | DocketPORT468 | DocketPORT487 | DocketPORT488
;   DocketPORT667 | DocketPORT687
; Example:
;   scanner_model = DocketPORT487
scanner_model =

; ─────────────────────────────────────────────────────────────────────────────
; Optional overrides (can also be set via environment variables)
; ─────────────────────────────────────────────────────────────────────────────

; Scan resolution in DPI (default 300).
; Valid values depend on your model — 100, 150, 200, 300, 400, 600.
; 300 DPI is recommended for ID card OCR via Google Vision.
; FDN_AMBIR_RESOLUTION overrides this.
;resolution = 300

; Seconds to wait for the user to insert a document before timing out (default 30).
; FDN_AMBIR_WAIT_TIMEOUT_S overrides this.
;wait_timeout_s = 30
