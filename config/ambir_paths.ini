; AMBIR scanner configuration (nScan 690gt and/or DocketPORT)
; ─────────────────────────────────────────────────────────────────────────────
; Copy/edit this file on each PC. It is gitignored — do not commit machine paths.
; Environment variables (FDN_AMBIR_*) override these settings.
;
; nScan 690gt (hotel ID scanner) — RECOMMENDED:
;   1. Install Ambir nScan 690gt USB driver (creates NS690gt.DLL in System32).
;   2. Confirm:  C:\Windows\System32\NS690gt.DLL
;   3. Set:
;        dll_path = C:\Windows\System32\NS690gt.DLL
;        scanner_model = nScan690gt
;      (model string is CASE-SENSITIVE for SI_OpenInterface)
;
; DocketPORT:
;   dll_path = C:\Windows\System32\DPORT487.dll
;   scanner_model = DocketPORT487
;
; If dll_path and scanner_model are both left empty, the host auto-detects
; NS690gt.DLL / DPORT*.dll under System32 / SysWOW64.
; ─────────────────────────────────────────────────────────────────────────────

[Paths]

; Full path to the scanner DLL (NS690gt.DLL or DPORT*.dll).
; Example for 690gt:
;   dll_path = C:\Windows\System32\NS690gt.DLL
dll_path =

; Model name for SI_OpenInterface — must match exactly (case-sensitive).
; Supported:
;   nScan690gt
;   DocketPORT467 | DocketPORT468 | DocketPORT487 | DocketPORT488
;   DocketPORT667 | DocketPORT687
; Example for 690gt:
;   scanner_model = nScan690gt
scanner_model =

; ─────────────────────────────────────────────────────────────────────────────
; Optional overrides (can also be set via environment variables)
; ─────────────────────────────────────────────────────────────────────────────

; Scan resolution in DPI (default 300).
;resolution = 300

; Seconds to wait for the user to insert a document before timing out (default 30).
;wait_timeout_s = 30
